name: Deploy to ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: 480038062484.dkr.ecr.ap-southeast-1.amazonaws.com/spec-app
  ECS_CLUSTER: spec-app-cluster
  API_SERVICE: spec-app-api-service
  WORKER_SERVICE: spec-app-worker-service
  API_TASK_DEFINITION: spec-app-api
  WORKER_TASK_DEFINITION: spec-app-worker
  CONTAINER_NAME_API: spec-app-api
  CONTAINER_NAME_WORKER: spec-app-worker

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image to ECR
        id: build-image
        working-directory: backend
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REPOSITORY:latest .
          docker push $ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REPOSITORY:latest
          echo "image=$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download API task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.API_TASK_DEFINITION }} \
            --query taskDefinition \
            > api-task-definition.json

      - name: Update API task definition with new image
        id: api-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: api-task-definition.json
          container-name: ${{ env.CONTAINER_NAME_API }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy API service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.api-task-def.outputs.task-definition }}
          service: ${{ env.API_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Download Worker task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.WORKER_TASK_DEFINITION }} \
            --query taskDefinition \
            > worker-task-definition.json

      - name: Update Worker task definition with new image
        id: worker-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: worker-task-definition.json
          container-name: ${{ env.CONTAINER_NAME_WORKER }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Worker service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.worker-task-def.outputs.task-definition }}
          service: ${{ env.WORKER_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true